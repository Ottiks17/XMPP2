name: Python CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libc-ares-dev xvfb
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r requirements.txt
      - name: Check code style with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run tests with pytest
        run: |
          xvfb-run pytest --verbose
  build-and-release:
    runs-on: windows-2022
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller requests
      - name: Bump version
        id: bump
        run: |
          $current = python -c "from version import VERSION; print(VERSION)"
          $parts = $current.Split('.')
          $parts[2] = [int]$parts[2] + 1
          $new_version = $parts -join '.'
          "VERSION = `"$new_version`"" | Out-File -FilePath version.py -Encoding utf8
          echo "VERSION=$new_version" >> $env:GITHUB_OUTPUT
      - name: Commit new version
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add version.py
          git commit -m "Bump version to ${{ steps.bump.outputs.VERSION }} [skip ci]"
          git push
      - name: Build exe
        run: |
          pyinstaller --onedir --windowed --name "XMPPClient" --collect-all PyQt5 main.py
          Compress-Archive -Path dist\XMPPClient\* -DestinationPath XMPPClient.zip
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.bump.outputs.VERSION }}
          name: Release v${{ steps.bump.outputs.VERSION }}
          files: XMPPClient.zip
          token: ${{ secrets.GITHUB_TOKEN }}
