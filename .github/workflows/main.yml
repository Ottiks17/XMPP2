name: Python CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libc-ares-dev xvfb
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r requirements.txt
      - name: Check code style with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run tests with pytest
        run: |
          xvfb-run pytest --verbose

  build-and-release:
    runs-on: windows-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Get version
        id: version
        run: |
          $version = python -c "from version import VERSION; print(VERSION)"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
      - name: Build exe
        run: |
          pyinstaller --onedir --windowed --name "XMPPClient" main.py
          Compress-Archive -Path dist\XMPPClient\* -DestinationPath XMPPClient.zip
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          files: XMPPClient.zip
          token: ${{ secrets.GITHUB_TOKEN }}
